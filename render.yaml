services:
  - type: web
    name: acts-backend-go
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8081
      - key: VERIFY_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: AI_ENDPOINT
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
